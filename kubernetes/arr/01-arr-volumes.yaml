# Config PVCs for the ARR stack — all on the K3s node's local disk (VM 102 OS disk).
# Kept separate from media data so app configs survive a USB disk disconnect.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
  storageClassName: local-path
