apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  #settings.yaml: |
  #  providers:
  #    longhorn:
  #      url: https://longhorn.my.network
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
  services.yaml: |
    - Infrastructure:
        - Proxmox:
            icon: proxmox.svg
            href: https://192.168.1.151:8006
            description: PVE1
            widget:
              type: proxmox
              url: https://192.168.1.151:8006
              username: api@pam!homepage
              password: {{HOMEPAGE_VAR_PROXMOX_PW}}
    - Media:
        - Jellyfin:
            icon: jellyfin.svg
            href: http://jellyfin.my.network
            description: Media server
            # widget:
            #   type: jellyfin
            #   url: http://jellyfin.media.svc.cluster.local:8096
            #   key: <jellyfin-api-key>
        - Jellyseerr:
            icon: jellyseerr.svg
            href: http://jellyseerr.my.network
            description: Media requests
            # widget:
            #   type: jellyseerr
            #   url: http://jellyseerr.media.svc.cluster.local:5055
            #   key: <jellyseerr-api-key>
    - Arr Stack:
        - Radarr:
            icon: radarr.svg
            href: http://radarr.my.network
            description: Movies
            # widget:
            #   type: radarr
            #   url: http://radarr.media.svc.cluster.local:7878
            #   key: <radarr-api-key>
        - Sonarr:
            icon: sonarr.svg
            href: http://sonarr.my.network
            description: TV shows
            # widget:
            #   type: sonarr
            #   url: http://sonarr.media.svc.cluster.local:8989
            #   key: <sonarr-api-key>
        - Prowlarr:
            icon: prowlarr.svg
            href: http://prowlarr.my.network
            description: Indexers
            # widget:
            #   type: prowlarr
            #   url: http://prowlarr.media.svc.cluster.local:9696
            #   key: <prowlarr-api-key>
        - qBittorrent:
            icon: qbittorrent.svg
            href: http://qbittorrent.my.network
            description: Torrent client
            # widget:
            #   type: qbittorrent
            #   url: http://qbittorrent.media.svc.cluster.local:8081
            #   username: <username>
            #   password: <password>
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
